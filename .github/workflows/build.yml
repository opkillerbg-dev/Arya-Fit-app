name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
      - run: npm install
      - run: mkdir -p www && cp index.html manifest.webmanifest sw.js icon-*.png www/
      - run: npx cap add android && npx cap sync android
      - run: |
          cat > android/app/src/main/java/com/arya/fit/MainActivity.java <<'J'
          package com.arya.fit;
          import android.os.Bundle;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(Bundle b){ super.onCreate(b);
              WindowManager.LayoutParams p=getWindow().getAttributes(); p.preferredRefreshRate=120f; getWindow().setAttributes(p); }
          }
          J
      - run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION"/><uses-permission android:name="android.permission.VIBRATE"/><uses-permission android:name="android.permission.WAKE_LOCK"/><application#' android/app/src/main/AndroidManifest.xml
          cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: arya-fit-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
