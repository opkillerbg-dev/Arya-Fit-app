name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
      - run: npm install
      - run: |
          mkdir -p www
          cp index.html liquid.css readiness.js progression.js handsfree.js animate.js weekly.js bodyheat.js swap.js backup.js library.js settings.js routemap.js boot.js manifest.webmanifest sw.js icon-*.png www/
          cp -r images www/images
          test -f www/images/hero/arya-run-hero.webp
          test -f www/images/anatomy/arya-anatomy-atlas.webp
          test -f www/images/exercises/arya-ex-push-ups-a.webp
          echo "exercise pictures: $(ls www/images/exercises | wc -l)"
      - run: npx cap add android && npx cap sync android
      - name: Set increasing Android version code
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          sed -i -E "s/versionCode[[:space:]]+[0-9]+/versionCode ${VERSION_CODE}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"1.${VERSION_CODE}\"/" android/app/build.gradle
          grep -q "versionCode ${VERSION_CODE}" android/app/build.gradle
          grep -q "versionName \"1.${VERSION_CODE}\"" android/app/build.gradle
          # New install id so it installs NEXT TO the old app (old key cannot be updated)
          sed -i -E 's/applicationId "com\.arya\.fit"/applicationId "com.arya.fit2"/' android/app/build.gradle
          grep -q 'applicationId "com.arya.fit2"' android/app/build.gradle
          echo "versionCode=${VERSION_CODE}"
      - run: cp RunService.java RunEnginePlugin.java StepsPlugin.java android/app/src/main/java/com/arya/fit/
      - run: |
          R=android/app/src/main/res
          mkdir -p $R/drawable-nodpi $R/mipmap-anydpi-v26
          cp icon-512-maskable.png $R/drawable-nodpi/ic_bg.png
          for n in ic_launcher ic_launcher_round; do
          cat > $R/mipmap-anydpi-v26/$n.xml <<'X'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/ic_bg"/>
            <foreground android:drawable="@android:color/transparent"/>
          </adaptive-icon>
          X
          done
      - run: |
          cat > android/app/src/main/java/com/arya/fit/MainActivity.java <<'J'
          package com.arya.fit;
          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            private volatile int siT=0,siR=0,siB=0,siL=0;
            public class AxBridge {
              @JavascriptInterface public String get(){ return siT+","+siR+","+siB+","+siL; }
              @JavascriptInterface public void style(final boolean dark){
                runOnUiThread(() -> { try {
                  WindowInsetsControllerCompat c=WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  if(c!=null){ c.setAppearanceLightStatusBars(!dark); c.setAppearanceLightNavigationBars(!dark); }
                } catch(Throwable t){} });
              }
            }
            private void pushInsets(){
              try {
                final WebView wv=getBridge().getWebView();
                if(wv==null) return;
                wv.evaluateJavascript("window.axSI&&axSI("+siT+","+siR+","+siB+","+siL+")", null);
              } catch(Throwable t){}
            }
            @Override public void onCreate(Bundle b){
              registerPlugin(RunEnginePlugin.class); registerPlugin(StepsPlugin.class); super.onCreate(b);
              WindowManager.LayoutParams p=getWindow().getAttributes(); p.preferredRefreshRate=120f; getWindow().setAttributes(p);
              try {
                final Window w=getWindow();
                WindowCompat.setDecorFitsSystemWindows(w,false);
                w.setStatusBarColor(Color.TRANSPARENT);
                w.setNavigationBarColor(Color.TRANSPARENT);
                if(Build.VERSION.SDK_INT>=29){ w.setNavigationBarContrastEnforced(false); }
                final WebView wv=getBridge().getWebView();
                wv.addJavascriptInterface(new AxBridge(),"AxInsets");
                final View content=findViewById(android.R.id.content);
                ViewCompat.setOnApplyWindowInsetsListener(w.getDecorView(), (v, ins) -> {
                  Insets sb=ins.getInsets(WindowInsetsCompat.Type.systemBars()|WindowInsetsCompat.Type.displayCutout());
                  Insets ime=ins.getInsets(WindowInsetsCompat.Type.ime());
                  float d=getResources().getDisplayMetrics().density;
                  siT=Math.round(sb.top/d); siL=Math.round(sb.left/d); siR=Math.round(sb.right/d);
                  siB=ime.bottom>0 ? 0 : Math.round(sb.bottom/d);
                  if(content!=null) content.setPadding(0,0,0,ime.bottom);
                  pushInsets();
                  wv.postDelayed(() -> pushInsets(), 400);
                  wv.postDelayed(() -> pushInsets(), 1800);
                  return ins;
                });
                ViewCompat.requestApplyInsets(w.getDecorView());
              } catch(Throwable t){}
            }
            @Override public void onResume(){ super.onResume(); pushInsets(); }
          }
          J
      - run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION"/><uses-permission android:name="android.permission.VIBRATE"/><uses-permission android:name="android.permission.WAKE_LOCK"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE"/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/><application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#</application>#<service android:name=".RunService" android:exported="false" android:foregroundServiceType="location"/></application>#' android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.ACTIVITY_RECOGNITION"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE_HEALTH"/><uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/><uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/><application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#</application>#<service android:name=".StepsPlugin$Svc" android:exported="false" android:foregroundServiceType="health"/><receiver android:name=".StepsPlugin$Boot" android:exported="true"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/><action android:name="android.intent.action.MY_PACKAGE_REPLACED"/></intent-filter></receiver></application>#' android/app/src/main/AndroidManifest.xml
          grep -q 'StepsPlugin.Svc' android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<queries><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries><application#' android/app/src/main/AndroidManifest.xml
          cd android && ./gradlew assembleDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: arya-fit-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
