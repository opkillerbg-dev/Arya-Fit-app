name: Build APK
on:
  push:
    paths-ignore: ['update.zip', 'docs/**', 'README.md']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: Fixed debug keystore (keeps the app signature stable)
        run: mkdir -p ~/.android && cp signing/debug.keystore ~/.android/debug.keystore
      - name: Check web files
        run: python3 tools/check-web.py
      - run: npm install
      - name: Create Android project from web/
        run: npx cap add android && npx cap sync android
      - name: Set increasing Android version code
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          sed -i -E "s/versionCode[[:space:]]+[0-9]+/versionCode ${VERSION_CODE}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"1.${VERSION_CODE}\"/" android/app/build.gradle
          grep -q "versionCode ${VERSION_CODE}" android/app/build.gradle
          grep -q "versionName \"1.${VERSION_CODE}\"" android/app/build.gradle
          # New install id so it installs NEXT TO the old app (old key cannot be updated)
          sed -i -E 's/applicationId "com\.arya\.fit"/applicationId "com.arya.fit2"/' android/app/build.gradle
          grep -q 'applicationId "com.arya.fit2"' android/app/build.gradle
          echo "versionCode=${VERSION_CODE}"
      - name: Apply native setup (splash, plugins, MainActivity, icon, manifest)
        run: bash tools/android-setup.sh
      - name: Build and verify APK
        run: |
          cd android && ./gradlew assembleDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: arya-fit-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
