name: Migrate repo layout (one time)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Replace repo contents with the zip
        run: |
          set -euo pipefail
          Z=arya-fit-repo-v81.zip
          test -f "$Z" || { echo "::error::upload $Z to the repo root first"; exit 1; }
          rm -rf /tmp/x && mkdir /tmp/x && unzip -q "$Z" -d /tmp/x
          SRC=$(find /tmp/x -mindepth 1 -maxdepth 1 -type d | head -n 1)
          test -f "$SRC/web/index.html" || { echo "::error::zip does not contain web/index.html"; exit 1; }
          # remove every tracked file except .github/ (token cannot edit workflows) and the zip
          git ls-files -z | grep -zv '^\.github/' | grep -zv "^$Z\$" | xargs -0 -r git rm -q
          rm -rf "$SRC/.github"   # the token may not edit workflow files; build.yml is pasted by hand
          cp -a "$SRC"/. ./
          git rm -q "$Z"
          git add -A
          git -c user.name="repo-migration" -c user.email="actions@users.noreply.github.com" commit -q -m "Reorganize repo into web/ native/ tools/ signing/ docs/ (v81)"
          git push origin HEAD
          echo "Done. Now paste the new build.yml over .github/workflows/build.yml and delete migrate.yml."
